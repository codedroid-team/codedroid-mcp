services:
  owncloud:
    image: owncloud/server:10.16.7
    ports:
      - "8080:8080"
    volumes:
      - owncloud-data:/mnt/data
    environment:
      OWNCLOUD_DOMAIN: ${OWNCLOUD_DOMAIN:?set OWNCLOUD_DOMAIN in eval/owncloud/.env}
      OWNCLOUD_TRUSTED_DOMAINS: ${OWNCLOUD_TRUSTED_DOMAINS:?set OWNCLOUD_TRUSTED_DOMAINS in eval/owncloud/.env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in eval/owncloud/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in eval/owncloud/.env}
      HTTP_PORT: "8080"

volumes:
  owncloud-data:
